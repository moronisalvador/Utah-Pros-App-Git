name: iOS ASC add tester

# Adds an EXISTING App Store Connect team member to an internal TestFlight
# group so they receive builds. Refuses emails that are not yet team members
# (the ASC invitation must be accepted first — see "iOS ASC reinvite").
# Companion to the diagnose/distribute/reinvite workflows.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Team member's App Store Connect email"
        required: true
        type: string
      group:
        description: "Internal TestFlight group to add them to"
        required: true
        default: "UPR Technicians"
        type: string
      variant:
        description: "Which app the group belongs to"
        required: true
        default: production
        type: choice
        options: [production, dev]

permissions:
  contents: read

concurrency:
  group: ios-asc-add-tester-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-tester:
    runs-on: macos-26
    environment: ios-testflight
    timeout-minutes: 15
    env:
      UPR_RELEASE_VARIANT: ${{ inputs.variant || 'production' }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3.12 and locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler: 2.5.22
          bundler-cache: true
          working-directory: ios

      - name: Add the team member to the TestFlight group
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          TESTER_EMAIL: ${{ inputs.email }}
          TESTER_GROUP: ${{ inputs.group }}
        run: bundle exec fastlane ios add_tester
