name: CI

# Pre-merge gate. main IS production (Cloudflare deploys main to utahpros.app, and
# the native app loads /tech/* from the same build); dev IS staging (dev.utahpros.app,
# auto-deploys on push). This runs build+test on every PR targeting main OR dev and
# on push to either — so staging no longer ships unchecked (UX-Quality F-S1, 2026-07).
#
# What blocks a merge:  build + test + changed-file lint + migration hygiene
#                       + bundle budgets — src/index.css and route-chunk
#                                       (perf-budget.md §1; entry-graph JS is measured
#                                        and printed but advisory until it is back under
#                                        budget — see scripts/bundle-size-report.mjs)
# What does NOT block:  full-tree lint  (pre-existing hygiene baseline; changed files are
#                                        independently ratcheted with zero warning tolerance)
#
# NOTE: a passing workflow does not enforce anything by itself. To actually block
# merges, mark the "verify" check as a Required status check in branch protection
# for BOTH main and dev (Settings → Branches).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Provenance validation resolves reviewed historical commits and capture ancestry.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. Every migration added after 2026-07-29 must ship a paired
      # rollback, justify any anon grant, revoke PUBLIC on definers, and mark
      # destructive DDL. Existing migrations are grandfathered by baseline.
      - name: Migration hygiene (blocking)
        run: node scripts/check-migration-hygiene.mjs

      # Warning-only BY DESIGN (not continue-on-error — the script itself
      # always exits 0 when the metadata is readable and annotates via
      # ::warning::). A stale db/baseline means local migration proofs run
      # against an old copy of production; CI cannot measure live drift
      # (credential-free), so it surfaces age instead.
      - name: DB baseline age (warning only)
        run: npm run db:baseline:age

      - name: Validate repository tooling governance
        run: npm run validate:tooling

      - name: Test repository tooling governance
        run: npm run test:tooling

      # worktree-inventory + the wip register. These guard the tools every parallel
      # session relies on to not lose work, and until now CI ran NEITHER of them —
      # `npm test` does not include `test:worktrees`. That is how the register
      # shipped writing entries into the main checkout instead of the worktree that
      # owned them (#614), and then reading only one directory so five real STALLED
      # alarms stayed invisible (#618). Both were found by hand, months apart.
      # A test that runs only when a human remembers the command guards less than
      # it appears to.
      - name: Test worktree and wip tooling
        run: npm run test:worktrees

      - name: Validate disconnected Figma governance
        run: npm run validate:figma-governance

      - name: Test Figma governance refusals
        run: npm run test:figma-governance

      # Mirror the production build. Supabase URL/anon key come from repo secrets
      # (same names the Capgo deploy workflow uses); the build also succeeds
      # without them, so this stays green even if the secrets are unset.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Test
        run: npm test

      # Provenance runs AFTER build+test, deliberately. It used to run before them, so
      # stale evidence (6h TTL) skipped build and test entirely and hid whether the code
      # compiled — CI was red for hours on 2026-07-27 for that reason alone. Real drift
      # still fails here on any branch; only staleness is treated differently, and it is
      # promoted to a hard failure just for the release gate below.
      - name: Test migration provenance gate
        run: npm run test:provenance

      - name: Validate migration provenance (drift blocks; stale only warns)
        run: npm run validate:provenance

      # main IS production. Promoting requires evidence that is actually current, so
      # staleness blocks here and nowhere else.
      - name: Validate migration provenance — release freshness
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm run validate:provenance -- --strict-freshness

      # Credential-free synthetic browser foundation only. The target origin is a code constant
      # (127.0.0.1:4173); production/dev/hosted Supabase and provider egress fail closed.
      - name: Install governed browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test credential-free browser foundation
        run: npm run test:browser

      # Non-blocking until the 175-error lint baseline is cleared. Surfaces lint
      # output in the run without failing the gate. Flip to blocking by removing
      # continue-on-error once the baseline is green.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Blocking changed-files ratchet: enforce the UX-Quality and runtime-safety
      # rules on just the files a PR touches. The frozen per-file/per-rule baseline
      # handles debt accumulated on dev before the first production promotion after
      # this gate became blocking; findings may shrink but never grow.
      - name: Test changed-files lint ratchet
        run: npm run test:lint-ratchet

      - name: Lint changed files (blocking ratchet)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          npm run validate:lint-ratchet -- "origin/${{ github.base_ref }}"

      # Perf-budget enforcement (perf-budget.md §1). BLOCKING for the src/index.css
      # and route-chunk budgets; entry-graph JS is measured and printed loudly but
      # does not fail (owner decision 2026-07-27 — it was already ~2.7 KB over the
      # +10% line the moment the measurement was fixed, and gating it same-day would
      # have turned dev red for unrelated merges). Flip BLOCKING.entryJsGzip in
      # scripts/bundle-size-report.mjs once the entry graph is back under budget.
      # This tested entry-graph report supersedes the interim check-bundle-budget.mjs
      # guard (merged same day via PR #541) — one budget system, not two.
      - name: Test bundle size report
        run: npm run test:bundle-size

      - name: Bundle size budgets
        run: npm run report:bundle-size -- --strict

  # The behavioral database lane (supabase/tests/**) against the seeded qa-staging
  # Supabase branch. The branch is live; the fourth secret is the QA-only fixture
  # password used by signed-in behavioral tests. No production credential is used.
  db-lane:
    runs-on: ubuntu-latest
    # Serialize db-lane GLOBALLY (deliberately NOT per-ref, unlike the workflow-level
    # group above): every run hits the ONE seeded fixture org on the shared qa-staging
    # branch, and when a push-event run and a pull_request-event run overlap (e.g. a
    # commit to dev while a dev→main PR is open) they race each other's inserts —
    # before/after count-delta assertions fail nondeterministically ("expected 1, got 2",
    # proven 2026-08-06 on crm_attribution_excludes_merged_leads). With
    # cancel-in-progress:false a later run QUEUES instead of overlapping. Known GitHub
    # semantics caveat: only one run queues per group — if a third arrives, GitHub
    # cancels the previously QUEUED one (that run shows a cancelled db-lane; acceptable
    # for superseded intermediate commits, and any open PR re-runs on its next push).
    concurrency:
      group: db-lane-qa-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run db lane against qa-staging branch
        env:
          UPR_QA_SUPABASE_URL: ${{ secrets.UPR_QA_SUPABASE_URL }}
          UPR_QA_SUPABASE_ANON_KEY: ${{ secrets.UPR_QA_SUPABASE_ANON_KEY }}
          UPR_QA_SUPABASE_SERVICE_KEY: ${{ secrets.UPR_QA_SUPABASE_SERVICE_KEY }}
          UPR_QA_FIXTURE_PASSWORD: ${{ secrets.UPR_QA_FIXTURE_PASSWORD }}
        run: |
          if [ -z "$UPR_QA_SUPABASE_URL" ]; then
            echo "::warning title=DB lane NOT CONFIGURED::The qa-staging branch is not seeded/wired. supabase/tests/** does NOT run in CI. See docs/database/staging-branch-runbook.md §2."
            exit 0
          fi
          npm run test:db:branch
