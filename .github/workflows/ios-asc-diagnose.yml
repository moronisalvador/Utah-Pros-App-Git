name: iOS ASC diagnose

# Read-only App Store Connect diagnostic for TestFlight distribution issues.
# Prints the official app's beta groups (name, internal flag, auto-distribution)
# and the 20 most recent builds with processing state + group assignment.
# Born from the 2026-08-06 finding that every automated official-app upload
# reached ASC but was never assigned to a TestFlight group (production variant
# carries internal_group: nil), so builds sat invisible while fastlane
# reported success. Dispatch-only; uploads nothing, mutates nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-asc-diagnose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-26
    environment: ios-testflight
    timeout-minutes: 15
    env:
      UPR_RELEASE_VARIANT: production
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby 3.3.12 and locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.12
          bundler: 2.5.22
          bundler-cache: true
          working-directory: ios

      - name: Diagnose TestFlight distribution state (read-only)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: bundle exec fastlane ios diagnose
