<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Asset not found</title>
  </head>
  <body>
    <!--
      Served with status 404 for any /assets/* path that does not exist
      (see public/_redirects). Deliberately NOT the app shell: answering a
      hashed .js URL with index.html at status 200 is what poisons the edge
      and browser caches for a year and leaves a permanently blank app.

      Nobody navigates here. It exists only so a missing chunk fails loudly
      and recoverably instead of silently and permanently.
    -->
    Asset not found.
  </body>
</html>
